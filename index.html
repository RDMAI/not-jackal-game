<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Jackal Game</title>
  </head>
  <body>
    <h1>Not Jackal (Jackal clone)</h1>
    <p>Your id: <span id="myId"></span></p>
    <div id="lobby">
      <input id="roomIdInput" placeholder="Enter room id" />
      <select id="maxPlayers">
        <option value="2">2 players</option>
        <option value="3">3 players</option>
        <option value="4">4 players</option>
      </select>
      <button id="createBtn">Create</button>
      <button id="joinBtn">Join</button>
      <button id="startBtn">Start game</button>
      <p id="roomError" style="color: red"></p>
    </div>
    <div id="hud" style="display: none">
      <p id="turnLabel"></p>
      <p id="scores"></p>
      <button id="grabBtn">Grab coin</button>
      <button id="dropBtn">Drop / Deposit</button>
      <button id="endTurnBtn">End turn</button>
      <button id="shipLeftBtn">Ship ◀</button>
      <button id="shipRightBtn">Ship ▶</button>
      <p id="status"></p>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      document.getElementById('myId').textContent =
        localStorage.getItem('notjackal_playerId') ?? '(new — reload to mint)';
    </script>
  </body>
</html>
